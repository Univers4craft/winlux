name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Installer les outils système
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            xorriso grub-pc-bin grub-efi-amd64-bin \
            linux-image-generic xserver-xorg-core \
            x11-xserver-utils gcc-mingw-w64-x86-64 \
            cpio fakeroot zstd

      - name: Compiler et tester
        run: |
          cargo test -p winlux
          cargo build --release -p winlux
          bash scripts/build-tests.sh
          bash scripts/test-runtime.sh
          bash scripts/test-runtime-parallel.sh

      - name: Construire le paquet de mise à jour (runtime)
        run: bash scripts/build-update-bundle.sh --runtime "$GITHUB_REF_NAME"

      - name: Construire l'ISO
        run: |
          kernel=$(ls /boot/vmlinuz-* 2>/dev/null | head -1)
          if [ -z "$kernel" ]; then
            echo "Noyau introuvable, ISO ignorée" >&2
            echo "SKIP_ISO=true" >> "$GITHUB_ENV"
          else
            release=$(basename "$kernel" | sed 's/^vmlinuz-//')
            WINLUX_KERNEL="$kernel" \
            WINLUX_KERNEL_RELEASE="$release" \
              bash scripts/build-live-iso.sh "build/winlux-live-$GITHUB_REF_NAME.iso"
            echo "SKIP_ISO=false" >> "$GITHUB_ENV"
          fi

      - name: Calculer les sommes SHA-256
        run: |
          cd build
          sha256sum winlux-update-"$GITHUB_REF_NAME".tar.gz > winlux-update-"$GITHUB_REF_NAME".tar.gz.sha256
          if [ "$SKIP_ISO" = "false" ]; then
            sha256sum winlux-live-"$GITHUB_REF_NAME".iso > winlux-live-"$GITHUB_REF_NAME".iso.sha256
          fi

      - name: Publier la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            "build/winlux-update-$GITHUB_REF_NAME.tar.gz"
            "build/winlux-update-$GITHUB_REF_NAME.tar.gz.sha256"
            build/winlux-update-manifest.txt
          )
          if [ "$SKIP_ISO" = "false" ]; then
            assets+=(
              "build/winlux-live-$GITHUB_REF_NAME.iso"
              "build/winlux-live-$GITHUB_REF_NAME.iso.sha256"
            )
          fi
          gh release create "$GITHUB_REF_NAME" \
            "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            --title "Winlux $GITHUB_REF_NAME"
