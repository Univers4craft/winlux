name: Release

on:
  push:
    # System previews are built and tested with a full ISO locally, then
    # uploaded with their system manifest. Never overwrite them with a
    # runtime-only package from this workflow.
    tags: ['v*', '!v*-preview.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Vérifier la version publiée
        run: test "$GITHUB_REF_NAME" = "$(cat VERSION)"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Installer les outils système
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            xorriso grub-pc-bin grub-efi-amd64-bin \
            linux-image-generic xserver-xorg-core \
            x11-xserver-utils gcc-mingw-w64-x86-64 \
            cpio fakeroot zstd kmod busybox-static \
            xvfb x11-xkb-utils xfonts-base fonts-dejavu-core \
            xserver-xorg-input-libinput libxft2 libmpg123-0 libfaad2 libasound2t64 \
            curl udev ffmpeg libarchive-tools parted dosfstools qemu-system-x86 ovmf

      - name: Compiler et tester
        run: |
          cargo test -p winlux
          cargo build --release -p winlux
          bash scripts/build-tests.sh
          bash scripts/test-runtime.sh
          bash scripts/test-runtime-parallel.sh

      - name: Construire le paquet de mise à jour (runtime)
        run: bash scripts/build-update-bundle.sh --runtime "$GITHUB_REF_NAME"

      - name: Construire l'ISO
        run: |
          kernel=$(ls /boot/vmlinuz-* 2>/dev/null | head -1)
          if [ -z "$kernel" ]; then
            echo "Noyau introuvable : publication refusée" >&2
            exit 1
          else
            release=$(basename "$kernel" | sed 's/^vmlinuz-//')
            WINLUX_KERNEL="$kernel" \
            WINLUX_KERNEL_RELEASE="$release" \
              bash scripts/build-live-iso.sh "build/winlux-live-$GITHUB_REF_NAME.iso"
            echo "SKIP_ISO=false" >> "$GITHUB_ENV"
          fi

      - name: Valider l'ISO et l'installation avant publication
        run: |
          test "$SKIP_ISO" = "false"
          sh scripts/test-install-safety.sh
          sh scripts/test-live-iso-qemu.sh "build/winlux-live-$GITHUB_REF_NAME.iso" bios
          sh scripts/test-live-iso-qemu.sh "build/winlux-live-$GITHUB_REF_NAME.iso" uefi
          sh scripts/test-install-vm-guest.sh "build/winlux-live-$GITHUB_REF_NAME.iso"

      - name: Calculer les sommes SHA-256
        run: |
          cd build
          sha256sum winlux-update-"$GITHUB_REF_NAME".tar.gz > winlux-update-"$GITHUB_REF_NAME".tar.gz.sha256
          if [ "$SKIP_ISO" = "false" ]; then
            sha256sum winlux-live-"$GITHUB_REF_NAME".iso > winlux-live-"$GITHUB_REF_NAME".iso.sha256
          fi

      - name: Publier la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -- "build/winlux-update-$GITHUB_REF_NAME.tar.gz" "build/winlux-update-$GITHUB_REF_NAME.tar.gz.sha256" build/winlux-update-manifest.txt
          if grep -q '^notes_asset=' build/winlux-update-manifest.txt; then
            set -- "$@" build/winlux-release-notes.txt
          fi
          if [ "$SKIP_ISO" = "false" ]; then
            set -- "$@" "build/winlux-live-$GITHUB_REF_NAME.iso" "build/winlux-live-$GITHUB_REF_NAME.iso.sha256"
          fi
          gh release create "$GITHUB_REF_NAME" \
            "$@" \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            --title "Winlux $GITHUB_REF_NAME"
