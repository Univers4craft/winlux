name: Release

on:
  push:
    # System previews are built and tested with a full ISO locally, then
    # uploaded with their system manifest. Never overwrite those manually
    # validated artifacts from this workflow. v0.2.3 is also built and validated
    # locally (full system + BIOS/UEFI installation), then published manually.
    tags: ['v*', '!v*-preview.*', '!v0.2.3']
  # Same build and VM validations without publishing, so a failing desktop
  # check can be fixed before a release tag is pushed.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/winlux-native-session.sh
      - scripts/test-native-session-guest.py
      - scripts/test-native-session-vm.sh
      - scripts/winlux-sessions.sh
      - scripts/winlux-user-session.sh
      - scripts/winlux-network-watch.sh
      - scripts/stage-apt-root.py
      - scripts/winlux-update-apt.py
      - scripts/test-update-curl-shim.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    # The desktop packages and native libraries are built against Ubuntu Resolute.
    runs-on: ubuntu-26.04
    env:
      RELEASE_NAME: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'validation' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Vérifier la version publiée
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "$(cat VERSION)"

      - name: Libérer de l'espace disque
        # Runners differ: v0.2.11's tag run had 1.2 GiB left for a 2 GiB ISO.
        # Drop the preinstalled SDKs this build never uses.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Installer les outils système
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            xorriso squashfs-tools grub-pc-bin grub-efi-amd64-bin \
            linux-image-generic xserver-xorg-core \
            x11-xserver-utils xinput gcc-mingw-w64-x86-64 \
            cpio fakeroot zstd kmod busybox-static mtools cryptsetup-bin \
            xvfb xterm ncurses-base x11-xkb-utils xfonts-base fonts-dejavu-core \
            xserver-xorg-input-libinput libxft2 libcairo2 libmpg123-0 libfaad2 libasound2t64 \
            curl udev ffmpeg libarchive-tools parted dosfstools qemu-system-x86 ovmf \
            dpkg-dev libgtk-3-0t64 libnss3 libnspr4 libgbm1 libxkbcommon0 libdbus-glib-1-2 \
            libqt5core5t64 libqt5gui5t64 libqt5widgets5t64 \
            libqt6core6t64 libqt6gui6 libqt6widgets6 \
            python3-gi gir1.2-gtk-3.0
          sudo apt-get install -y -q openbox wmctrl xdotool

      - name: Préparer Edge, Chrome et Firefox hors ligne
        run: python3 scripts/prepare-browser-packages.py build/browser-packages

      - name: Préparer le bureau natif et ses applications
        run: python3 scripts/prepare-desktop-packages.py build/desktop-components

      - name: Compiler et tester
        run: |
          cargo test -p winlux
          cargo build --release -p winlux
          bash scripts/build-tests.sh
          bash scripts/test-runtime.sh
          bash scripts/test-runtime-parallel.sh
          sh scripts/test-control.sh
          sh scripts/test-browsers.sh
          sh scripts/test-updater.sh
          sh scripts/test-update-notes.sh
          sh scripts/test-install-safety.sh
          /usr/bin/python3 -B scripts/test-apt-metadata.py
          xvfb-run -a /usr/bin/python3 -B scripts/test-settings-native.py
          xvfb-run -a dbus-run-session --config-file=scripts/test-session-bus.conf -- /usr/bin/python3 -B scripts/test-desktop-tools.py
          for popup in start volume power; do
            xvfb-run -a dbus-run-session --config-file=scripts/test-session-bus.conf -- /usr/bin/python3 -B scripts/test-shell-popups.py "$popup"
          done
          xvfb-run -a -s '-screen 0 1920x1080x24 -noreset' /usr/bin/python3 -B scripts/test-window-performance.py

      - name: Autoriser KVM
        # Without it QEMU falls back to TCG: the APT base install and the VM
        # validations are then far slower than their timeouts.
        run: |
          if test -e /dev/kvm; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
          ls -l /dev/kvm || true

      - name: Construire l'ISO
        run: |
          # The runner boots a cloud (Azure) kernel without built-in virtio
          # disk support; the APT base VM and real PCs need the generic one.
          kernel=$(find /boot -maxdepth 1 -name 'vmlinuz-*-generic' | sort -V | tail -1)
          test -n "$kernel"
          release=$(basename "$kernel" | sed 's/^vmlinuz-//')
          # Ubuntu restricts /boot to root; copy only the kernel, then build
          # unprivileged. Never publish a runtime fallback as a system release.
          sudo install -m 644 "$kernel" "$RUNNER_TEMP/winlux-kernel"
          python3 scripts/prepare-apt-base.py --kernel "$RUNNER_TEMP/winlux-kernel" --kernel-release "$release"
          WINLUX_KERNEL="$RUNNER_TEMP/winlux-kernel" \
          WINLUX_KERNEL_RELEASE="$release" \
            bash scripts/build-live-iso.sh "build/winlux-live-$RELEASE_NAME.iso" || { df -h /; exit 1; }
          test -s "build/winlux-live-$RELEASE_NAME.iso"
          # GitHub refuses release assets of 2 GiB or more: fail here, on PRs
          # too, rather than at the very last publishing step.
          size=$(stat -c %s "build/winlux-live-$RELEASE_NAME.iso")
          echo "Taille de l'ISO : $size octets"
          test "$size" -lt 2147483648 || { echo "ISO trop grande pour une release GitHub (limite 2 Gio)" >&2; exit 1; }
          echo "SKIP_ISO=false" >> "$GITHUB_ENV"

      - name: Valider les navigateurs en VM
        env:
          WINLUX_QEMU_MEMORY: 4096
        run: sh scripts/test-browsers-vm.sh

      - name: Préparer la mise à jour depuis la dernière version publiée
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Le test VM installe ce paquet puis lance « Mettre à jour » des
          # Paramètres avec l'outil de cette version vers le nouveau paquet.
          previous=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          if [ "$previous" = "$(cat VERSION)" ]; then echo "Version $previous déjà publiée : test de mise à jour ignoré"; exit 0; fi
          mkdir -p build/previous-release
          gh release download "$previous" --repo "$GITHUB_REPOSITORY" --dir build/previous-release \
            --pattern "winlux-desktop-$previous.deb" --pattern "winlux-desktop-$previous.deb.sha256"
          (cd build/previous-release && sha256sum -c "winlux-desktop-$previous.deb.sha256")
          echo "WINLUX_UPDATE_FROM_DEB=$PWD/build/previous-release/winlux-desktop-$previous.deb" >> "$GITHUB_ENV"
          # v0.2.12 : son outil passe à APT un fichier « .part » qu'APT refuse ;
          # ces installations doivent être réinstallées une fois.
          case "$previous" in v0.2.12) echo "WINLUX_UPDATE_WITH_CURRENT_TOOL=1" >> "$GITHUB_ENV" ;; esac

      - name: Valider le bureau natif en VM
        env:
          WINLUX_QEMU_MEMORY: 4096
        run: sh scripts/test-native-session-vm.sh

      - name: Valider l'ISO et l'installation avant publication
        env:
          WINLUX_QEMU_MEMORY: 4096
        run: |
          if [ "$SKIP_ISO" = "false" ]; then
            sh scripts/test-live-iso-qemu.sh "build/winlux-live-$RELEASE_NAME.iso" bios
            sh scripts/test-live-iso-qemu.sh "build/winlux-live-$RELEASE_NAME.iso" uefi
            # The diagnostic embeds a second ISO copy in RAM, unlike normal boot.
            WINLUX_QEMU_MEMORY=6144 sh scripts/test-install-vm-guest.sh "build/winlux-live-$RELEASE_NAME.iso"
          fi

      - name: Conserver les journaux de validation
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs
          path: |
            build/apt-base/bootstrap.log
            build/browser-vm.*/serial.log
            build/native-vm.*/serial.log
            build/native-vm.*/programs.log
            build/native-vm.*/window-latency.json
            build/native-vm.*/session-logs/*.log
            build/qemu-*.log
            build/install-guest.*/*.log

      - name: Construire la mise à jour
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          bash scripts/build-update-bundle.sh --system "$GITHUB_REF_NAME"
          grep -qx 'scope=system' build/winlux-update-manifest.txt
          grep -q '^components=.*desktop.*applications' build/winlux-update-manifest.txt

      - name: Calculer les sommes SHA-256
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd build
          asset=$(sed -n 's/^asset=//p' winlux-update-manifest.txt)
          sha256sum "$asset" > "$asset.sha256"
          if [ "$SKIP_ISO" = "false" ]; then
            sha256sum winlux-live-"$GITHUB_REF_NAME".iso > winlux-live-"$GITHUB_REF_NAME".iso.sha256
          fi

      - name: Publier la release GitHub
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset=$(sed -n 's/^asset=//p' build/winlux-update-manifest.txt)
          set -- "build/$asset" "build/$asset.sha256" build/winlux-update-manifest.txt
          if grep -q '^notes_asset=' build/winlux-update-manifest.txt; then
            set -- "$@" build/winlux-release-notes.txt
          fi
          if [ "$SKIP_ISO" = "false" ]; then
            set -- "$@" "build/winlux-live-$GITHUB_REF_NAME.iso" "build/winlux-live-$GITHUB_REF_NAME.iso.sha256"
          fi
          gh release create "$GITHUB_REF_NAME" \
            "$@" \
            --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
            --title "Winlux $GITHUB_REF_NAME"
          # Le manifeste latest ne devient visible qu'après tous les uploads.
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      - name: Vérifier le chemin de mise à jour publié
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Ce que lit winlux-update-apt sur un PC installé : le manifeste
          # « latest », puis le paquet et son empreinte qu'il désigne.
          url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/winlux-update-manifest.txt"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL -o published-manifest.txt "$url" && grep -qx "version=$GITHUB_REF_NAME" published-manifest.txt; then break; fi
            sleep 10
          done
          grep -qx "version=$GITHUB_REF_NAME" published-manifest.txt || { echo "Manifeste de mise à jour absent ou périmé sur la release latest" >&2; exit 1; }
          cmp published-manifest.txt build/winlux-update-manifest.txt
          asset=$(sed -n 's/^asset=//p' published-manifest.txt)
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > published-assets.txt
          grep -qx "$asset" published-assets.txt
          grep -qx "$asset.sha256" published-assets.txt
          echo "Mise à jour publiée : $(cat published-manifest.txt | tr '\n' ' ')"
