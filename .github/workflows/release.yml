name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Compiler et tester
        run: |
          cargo test -p winlux
          cargo build --release -p winlux
          bash scripts/build-tests.sh
          bash scripts/test-runtime.sh
          bash scripts/test-runtime-parallel.sh
      - name: Construire le paquet de mise à jour
        run: bash scripts/build-update-bundle.sh "$GITHUB_REF_NAME"
      - name: Publier la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/winlux-update-$GITHUB_REF_NAME.tar.gz" \
            build/winlux-update-manifest.txt \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            --title "Winlux $GITHUB_REF_NAME"
