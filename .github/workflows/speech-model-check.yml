# Temporaire (#662) : empreintes des modèles de reconnaissance vocale et essai
# réel de winlux-speech sur un runner (les conteneurs de développement ne
# joignent pas huggingface.co). Retiré avant la fusion.
name: speech-model-check
on:
  push:
    branches: [claude/project-thread-xvfub4]
jobs:
  hashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Empreintes des modèles
        run: |
          mkdir -p "$RUNNER_TEMP/models"
          for name in ggml-base-q5_1.bin ggml-small-q5_1.bin; do
            curl -sSIL "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/$name" | grep -i -E '^(x-repo-commit|x-linked-etag|x-linked-size|location)' || true
            curl -sSL --fail -o "$RUNNER_TEMP/models/$name" "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/$name"
            printf '%s %s %s\n' "$name" "$(stat -c %s "$RUNNER_TEMP/models/$name")" "$(sha256sum "$RUNNER_TEMP/models/$name" | cut -d' ' -f1)"
          done
      - name: Moteur whisper.cpp (paquet Ubuntu, le même que dans Winlux)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q whisper.cpp espeak-ng xvfb xauth python3-gi python3-gi-cairo gir1.2-gtk-3.0 pulseaudio pulseaudio-utils
          dpkg -s whisper.cpp | grep -E '^(Version|Installed-Size)'
          ls /usr/share/sounds/debian/samples/
      - name: Essai réel (fichiers enregistrés, puis vraie sortie audio PulseAudio)
        run: |
          set -x
          export WINLUX_SPEECH_MODEL_DIR="$RUNNER_TEMP/models"
          sample=/usr/share/sounds/debian/samples/en-Wikipedia-Ignore_All_Rules.wav
          espeak-ng -v fr -s 140 -w fr.wav "Bonjour, je dicte une phrase en français pour essayer la reconnaissance vocale."
          for model in base small; do
            python3 -I scripts/winlux-speech.py set model $model
            /usr/bin/time -f "%e s" python3 -I scripts/winlux-speech.py transcribe "$sample" en
            /usr/bin/time -f "%e s" python3 -I scripts/winlux-speech.py transcribe fr.wav fr
          done
          python3 -I scripts/winlux-speech.py set model base
          WINLUX_SPEECH_SAMPLE="$sample" WINLUX_SPEECH_SAMPLE_WORD=rule xvfb-run -a -s '-screen 0 1366x768x24' /usr/bin/python3 -B scripts/test-speech.py
          pulseaudio --start --exit-idle-time=-1 && sleep 2
          LC_ALL=C pactl get-default-sink
          python3 -I scripts/winlux-speech.py status
          for model in base small; do
            python3 -I scripts/winlux-speech.py set model $model
            rm -f captions.txt
            WINLUX_SPEECH_TYPED=$PWD/captions.txt xvfb-run -a -s '-screen 0 1366x768x24' /usr/bin/python3 scripts/winlux-speech.py captions start &
            sleep 4
            paplay "$sample"; paplay fr.wav; sleep 10
            python3 -I scripts/winlux-speech.py captions stop; sleep 2
            echo "== sous-titres ($model)"; cat captions.txt
            grep -qi rule captions.txt
          done
