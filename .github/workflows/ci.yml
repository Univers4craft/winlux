name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # 1. Vérifications statiques rapides sur le code source.
  hygiene:
    name: Hygiène
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-hygiene-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-hygiene-

      - name: Vérifier le formatage (rustfmt)
        run: cargo fmt --check -p winlux

      - name: Clippy (avertissements bloquants)
        run: cargo clippy -p winlux -- -D warnings

      - name: Ne pas dépendre de Wine
        run: |
          set -eu
          # Aucune bibliothèque Wine ne doit être référencée par le runtime.
          if grep -rn --include=*.rs -E 'extern "C" \{[^}]*\b(wine|ntdll_dll)\b' runtime/src; then
            echo "Dépendance Wine détectée" >&2; exit 1
          fi
          if grep -rn -E 'winegcc|winegcc|libwine|winebuild' --include=*.toml --include=*.sh .; then
            echo "Outil Wine détecté" >&2; exit 1
          fi
          echo "Aucune dépendance Wine."

      - name: Les scripts sont en LF et exécutables
        run: |
          set -eu
          for f in scripts/*.sh; do
            if grep -q $'\r' "$f"; then
              echo "Fini de ligne CRLF dans $f" >&2; exit 1
            fi
            test -x "$f" || { echo "$f n'est pas exécutable" >&2; exit 1; }
          done
          echo "Scripts valides."

      - name: Les PEs de test sont listés dans le script
        run: |
          set -eu
          # Tout .rs dans testexe/src/bin doit être référencé par test-runtime.sh,
          # sinon un test pourrait être oublié silencieusement.
          for b in testexe/src/bin/*.rs; do
            name=$(basename "$b" .rs)
            if ! grep -q "\b$name\b" scripts/test-runtime.sh; then
              echo "$name n'est pas exécuté par scripts/test-runtime.sh" >&2; exit 1
            fi
          done
          echo "Tous les binaires PE sont couverts."

  # 2. Build + tests unitaires du runtime.
  unit-tests:
    name: Tests unitaires
    runs-on: ubuntu-latest
    needs: hygiene
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-unit-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-unit-

      - name: Compiler le runtime
        run: cargo build --release -p winlux

      - name: Lancer les tests unitaires
        run: cargo test -p winlux

      - name: Vérifier les navigateurs hors ligne
        run: sh scripts/test-browsers.sh

      - name: Vérifier le catalogue natif Linux et Windows
        run: python3 -B scripts/test-native-catalogue.py

      - name: Vérifier benchmark, profils et migration de l'installateur
        run: python3 -B scripts/test-installer-oobe.py

      - name: Vérifier les fichiers de réponse d'installation silencieuse
        run: python3 -B scripts/test-autoinstall.py

      - name: Vérifier les grandes images X11 en 1080p
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb xauth libx11-6 libxft2 libcairo2
          xvfb-run -a -s '-screen 0 1920x1080x24' cargo test -p winlux grande_bitmap_1080p -- --ignored
          xvfb-run -a -s '-screen 0 1920x1080x24' cargo test -p winlux contours_anticreneles_x11 -- --ignored

      - name: Valider les codecs audio MP3 et AAC réels
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libmpg123-0 libfaad2 libasound2t64
          ALSA_CONFIG_PATH="$PWD/runtime/tests/audio/alsa-null.conf" cargo test -p winlux audio_codecs -- --ignored
          stage=$(mktemp -d)
          sh scripts/copy-audio-libraries.sh "$stage"

      - name: Valider le moteur vidéo/audio (FFmpeg réel)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          cargo test -p winlux media_bout_en_bout -- --ignored

      - name: Aucune erreur de compilation
        run: cargo check -p winlux --all-targets

      - name: Valider mise à jour et retour arrière
        run: |
          bash scripts/test-updater.sh
          sh scripts/test-update-notes.sh

      - name: Valider le réseau et les commandes des paramètres
        run: |
          sh scripts/test-install-safety.sh
          sh scripts/test-network.sh
          sh scripts/test-control.sh
          sh scripts/test-display.sh

  # 3. Compile les .exe Windows puis les exécute sous Winlux.
  runtime-tests:
    name: Tests runtime (PE)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-pe-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-pe-

      - name: Compiler le runtime
        run: cargo build --release -p winlux

      - name: Compiler les exécutables PE de test
        run: bash scripts/build-tests.sh

      - name: Exécuter les tests runtime
        run: bash scripts/test-runtime.sh

      - name: Exécuter les dix PE en parallèle
        run: bash scripts/test-runtime-parallel.sh

      - name: Tester l'intégration bureau (double-clic)
        run: sh scripts/test-integration.sh

      - name: Installer MinGW-w64
        run: sudo apt-get update -q && sudo apt-get install -y -q gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

      - name: Compiler et exécuter les tests C MinGW
        run: |
          sh scripts/build-mingw-tests.sh
          sh scripts/test-mingw.sh

      - name: Rapport des PE générés
        if: always()
        run: |
          ls -l target/x86_64-pc-windows-msvc/release/*.exe || true
