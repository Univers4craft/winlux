name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # 1. Vérifications statiques rapides sur le code source.
  hygiene:
    name: Hygiène
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-hygiene-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-hygiene-

      - name: Vérifier le formatage (rustfmt)
        run: cargo fmt --check -p winlux

      - name: Clippy (avertissements bloquants)
        run: cargo clippy -p winlux -- -D warnings

      - name: Ne pas dépendre de Wine
        run: |
          set -eu
          # Aucune bibliothèque Wine ne doit être référencée par le runtime.
          if grep -rn --include=*.rs -E 'extern "C" \{[^}]*\b(wine|ntdll_dll)\b' runtime/src; then
            echo "Dépendance Wine détectée" >&2; exit 1
          fi
          if grep -rn -E 'winegcc|winegcc|libwine|winebuild' --include=*.toml --include=*.sh .; then
            echo "Outil Wine détecté" >&2; exit 1
          fi
          echo "Aucune dépendance Wine."

      - name: Les scripts sont en LF et exécutables
        run: |
          set -eu
          for f in scripts/*.sh; do
            if grep -q $'\r' "$f"; then
              echo "Fini de ligne CRLF dans $f" >&2; exit 1
            fi
            test -x "$f" || { echo "$f n'est pas exécutable" >&2; exit 1; }
          done
          echo "Scripts valides."

      - name: Les PEs de test sont listés dans le script
        run: |
          set -eu
          # Tout .rs dans testexe/src/bin doit être référencé par test-runtime.sh,
          # sinon un test pourrait être oublié silencieusement.
          for b in testexe/src/bin/*.rs; do
            name=$(basename "$b" .rs)
            if ! grep -q "\b$name\b" scripts/test-runtime.sh; then
              echo "$name n'est pas exécuté par scripts/test-runtime.sh" >&2; exit 1
            fi
          done
          echo "Tous les binaires PE sont couverts."

  # 2. Build + tests unitaires du runtime.
  unit-tests:
    name: Tests unitaires
    runs-on: ubuntu-latest
    needs: hygiene
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-unit-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-unit-

      - name: Compiler le runtime
        run: cargo build --release -p winlux

      - name: Installer glslang (validation du GLSL traduit depuis DXBC)
        run: sudo apt-get update -q && sudo apt-get install -y -q glslang-tools

      - name: Lancer les tests unitaires
        run: cargo test -p winlux

      - name: BCL Winlux en C# et ses témoins (étape 7 du moteur .NET)
        run: |
          sudo apt-get install -y -q dotnet-runtime-10.0
          bash scripts/test-bcl.sh

      - name: Figer la surface d'exports de kernel32 (#521)
        run: python3 -B scripts/test-kernel32-exports.py
      - name: Pages de code asiatiques, modules gconv gardés dans l'ISO (#183)
        run: python3 -B scripts/test-dbcs-gconv.py

      - name: Inventaire des structures à taille x86 (#232)
        run: python3 -B scripts/test-wow32-structures.py

      - name: Vérifier les fonctions importées par les vrais jeux (docs/jeux/imports-jeux.tsv)
        run: python3 -B scripts/test-games-imports.py

      - name: Vérifier les lanceurs .desktop en quatre langues (#786)
        run: python3 -B scripts/test-desktop-languages.py

      - name: Vérifier l'accent violet par défaut (#790)
        run: python3 -B scripts/test-default-accent.py

      - name: Vérifier les tables de traduction (aucune clé en double)
        run: python3 -B scripts/test-translation-keys.py

      - name: Vérifier les navigateurs hors ligne
        run: |
          sh scripts/test-browsers.sh
          python3 -B scripts/test-browser-fetch.py

      - name: Vérifier que les liens web s'ouvrent dans le navigateur installé
        run: sh scripts/test-browser-links.sh

      - name: Vérifier le catalogue natif Linux et Windows
        run: python3 -B scripts/test-native-catalogue.py

      - name: Vérifier que chaque application livrée a son icône Prisme
        run: python3 -B scripts/test-app-icons.py

      - name: Vérifier benchmark, profils et migration de l'installateur
        run: python3 -B scripts/test-installer-oobe.py

      - name: Vérifier les fichiers de réponse d'installation silencieuse
        run: python3 -B scripts/test-autoinstall.py

      - name: Vérifier la liste des sources GPL de l'ISO et l'offre écrite de NOTICES
        run: python3 -B scripts/test-gpl-sources.py

      - name: Vérifier les notices et licences du paquet winlux-desktop (#33)
        run: python3 -B scripts/test-notices.py

      - name: Valider l'identité de l'image (nom Winlux, logos, sources GPL)
        run: python3 -B scripts/test-image-identity.py

      - name: Vérifier les trois chemins d'amorçage (BIOS, UEFI 64 et 32 bits)
        run: python3 -B scripts/test-boot-paths.py

      - name: Vérifier les finitions de l'installateur (veille, accent, note de performance)
        run: python3 -B scripts/test-installer-finitions.py

      - name: Vérifier le clavier dans le menu GRUB (terminal série réservé aux VM)
        run: python3 -B scripts/test-grub-keyboard.py

      - name: Vérifier que la clé démarre son live même si Winlux est installé
        run: python3 -B scripts/test-live-boot-target.py

      - name: Vérifier la description du matériel (cœurs, modèles du processeur et de la carte graphique)
        run: python3 -B scripts/test-benchmark-materiel.py

      - name: Vérifier l affichage des mises à jour (taille seulement si disponible)
        run: python3 -B scripts/test-update-listing.py

      - name: Vérifier les mises à jour signées Ed25519 (#31)
        run: python3 -B scripts/test-update-signature.py

      - name: Vérifier les mises à jour A/B (emplacement B, bascule et réserve)
        run: python3 -B scripts/test-ab-update.py

      - name: Vérifier les noms des pages Mise à jour OS et Mise à jour application (4 langues)
        run: python3 -B scripts/test-update-page-names.py

      - name: Vérifier le partitionnement manuel et l'échelle d'écran de l'installateur
        run: python3 -B scripts/test-installer-partitioning.py

      - name: Vérifier que l'installateur affiche la page de l'étape active
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb xauth python3-gi python3-gi-cairo gir1.2-gtk-3.0
          xvfb-run -a -s '-screen 0 1366x768x24' /usr/bin/python3 -B scripts/test-installer-startup.py

      - name: Vérifier les comptes locaux, « Changer d'utilisateur » et la veille du menu Démarrer
        run: xvfb-run -a -s '-screen 0 1366x768x24' /usr/bin/python3 -B scripts/test-accounts.py
      - name: Imprimantes, administrateurs dans lpadmin et refus de CUPS affiché (#622)
        run: xvfb-run -a -s '-screen 0 1366x768x24' /usr/bin/python3 -B scripts/test-printer-perms.py

      - name: Vérifier qu'aucune marque Microsoft n'est épinglée par défaut
        run: xvfb-run -a -s '-screen 0 1366x768x24' /usr/bin/python3 -B scripts/test-no-microsoft-branding.py

      - name: Vérifier les types de fichiers traduits (Thunar, fr/en/de/es)
        run: |
          sudo apt-get install -y -q shared-mime-info
          /usr/bin/python3 -B scripts/test-mime-translations.py

      - name: Vérifier les icônes Prisme claires et sombres (thèmes Winlux et Winlux-Sombre)
        run: xvfb-run -a -s '-screen 0 1366x768x24' sh scripts/test-icones.sh integration/native/icons

      - name: Vérifier la fenêtre Bienvenue et sa réouverture depuis le menu Démarrer
        run: xvfb-run -a -s '-screen 0 1366x768x24' /usr/bin/python3 -B scripts/test-welcome.py

      - name: Vérifier « Afficher dans le dossier » (FileManager1, xdg) vers l'Explorateur
        run: |
          sudo apt-get install -y -q dbus libglib2.0-bin
          /usr/bin/python3 -B scripts/test-filemanager1.py

      - name: Vérifier que l'Explorateur décode les URI file:// (xdg-open, accents, espaces)
        run: /usr/bin/python3 -B scripts/test-shell-app-uri.py

      - name: Vérifier les correctifs de l'Explorateur (copie de fond, Corbeille, Bloc-notes, icônes des lignes)
        run: python3 -B scripts/test-explorer-fixes.py

      - name: Vérifier la page Alimentation selon le matériel, les textes publics et le chemin de l'Explorateur
        run: xvfb-run -a -s '-screen 0 1366x768x24' /usr/bin/python3 -B scripts/test-power-page.py
      - name: Carte d'arrêt, « Annuler » par défaut (#2299)
        run: xvfb-run -a -s '-screen 0 1366x768x24' /usr/bin/python3 -B scripts/test-power-carte-annuler.py
      - name: Carte d'arrêt sur le verrou, mot de passe pour forcer (#2300)
        run: xvfb-run -a -s '-screen 0 1366x768x24' /usr/bin/python3 -B scripts/test-power-carte-verrou.py
      - name: Vérifier Paramètres › Sauvegarde (destination, planification, restauration)
        run: xvfb-run -a -s '-screen 0 1366x768x24' /usr/bin/python3 -B scripts/test-backup-page.py

      - name: Vérifier le réseau depuis le compte (resolv.conf lisible, règle polkit posée)
        run: python3 -B scripts/test-network-perms.py
      - name: Barre, infobulle Wi-Fi au nom du réseau (#914)
        run: python3 -B scripts/test-tray-wifi-name.py
      - name: Fenêtres .exe, icône trouvée pour un chemin relatif ou Windows (#915)
        run: python3 -B scripts/test-window-icon-target.py
      - name: Paint.NET, Direct3D 11.1 et Direct2D 1.1 avec effets personnalisés (#561)
        run: python3 -B scripts/test-paintnet-d2d.py
      - name: Vérifier Bluetooth (rfkill), OpenGL et bus d'accessibilité dans l'image
        run: python3 -B scripts/test-session-plumbing.py
      - name: Son du lecteur multimédia et des enregistrements nommé dans le mélangeur (#1010)
        run: python3 -B scripts/test-audio-stream-names.py
      - name: Lecteur multimédia, un seul flux audio par lecture (#1013)
        run: python3 -B scripts/test-media-one-stream.py
      - name: Tables SMBIOS pour GetSystemFirmwareTable (#1197)
        run: python3 -B scripts/test-firmware-tables.py
      - name: Stylet, WM_POINTER et wintab32 (#1199)
        run: python3 -B scripts/test-pen-input.py
      - name: Imprimantes du réseau (avahi-daemon lancé avant CUPS)
        run: python3 -B scripts/test-avahi-printers.py
      - name: su et sudo (droits de la base Ubuntu, su par sudo)
        run: python3 -B scripts/test-su-sudo.py
      - name: Vérifier « winlux-settings about » et les noms de page
        run: xvfb-run -a -s '-screen 0 1366x768x24' /usr/bin/python3 -B scripts/test-settings-args.py

      - name: Vérifier le signalement de problèmes (masquage, modèle, relais)
        run: python3 -B scripts/test-report.py

      - name: Vérifier l'envoi automatique des plantages (file, anonymisation, dédoublonnage)
        run: python3 -B scripts/test-report-auto.py

      - name: Vérifier le journal et l'état isolés entre comptes (#633)
        run: python3 -B scripts/test-journal-isolation.py

      - name: Vérifier l'écran de verrouillage (mot de passe, inactivité, réveil)
        run: python3 -B scripts/test-lock.py

      - name: Vérifier les autorisations des applications Windows
        run: python3 -B scripts/test-permission.py
      - name: Vérifier Téléphone connecté (faux téléphone Android, protocole KDE Connect)
        run: /usr/bin/python3 -B scripts/test-phone.py
      - name: Vérifier la fenêtre UAC (comptes administrateurs, mot de passe, langues)
        run: python3 -B scripts/test-uac.py
      - name: Vérifier le relais root du bureau (politique, préférences, élévation)
        run: python3 -B scripts/test-root.py
      - name: Vérifier le code PIN et l'empreinte (relais root, lecteur simulé, #659)
        run: python3 -B scripts/test-signin.py
      - name: Vérifier le contrôle parental (le compte surveillé ne lève pas sa restriction, #661)
        run: python3 -B scripts/test-parental.py
      - name: Vérifier que le Xorg de l'init a sa session (changement d'utilisateur, VT)
        run: python3 -B scripts/test-xorg-session.py
      - name: Vérifier que l'arrêt et le redémarrage par l'init ne restent jamais bloqués
        run: python3 -B scripts/test-init-power.py
      - name: Vérifier qu'une coupure après l'installation n'abîme plus les comptes (écran noir)
        run: python3 -B scripts/test-accounts-repair.py
      - name: Vérifier les pilotes de cet ordinateur ajoutés pendant l'installation (en ligne)
        run: python3 -B scripts/test-installer-drivers.py
      - name: Vérifier la date, l'heure et le fuseau dès l'installation
        run: python3 -B scripts/test-installer-time.py
      - name: Vérifier l'entrée de démarrage UEFI « Winlux » (NVRAM) en plus du chemin de secours
        run: python3 -B scripts/test-efi-boot-entry.py

      - name: Vérifier « Coller » sur le bureau (couper = déplacer, noms en double)
        run: python3 -B scripts/test-desktop-paste.py

      - name: Vérifier la détection des modes d'alimentation (économie, normal, turbo)
        run: python3 -B scripts/test-power-modes.py

      - name: Vérifier les widgets Win+W (réglages, météo partagée, bouton de la barre, langues)
        run: python3 -B scripts/test-widgets.py

      - name: Vérifier l'application Claude Code (téléchargement vérifié, terminal)
        run: python3 -B scripts/test-claude-code.py

      - name: Vérifier les régressions de la campagne de tests v0.2.13
        run: python3 -B scripts/test-campaign.py

      # Tests présents dans le dépôt mais lancés nulle part jusqu'ici.
      - name: Vérifier l'icône du menu Démarrer, la progression des mises à jour et Bienvenue
        run: |
          python3 -B scripts/test-start-icon.py
          python3 -B scripts/test-update-progress.py
          xvfb-run -a python3 -B scripts/test-welcome.py

      - name: Vérifier l'éclairage nocturne (soleil, planning, couleurs, langues)
        run: python3 -B scripts/test-ambiance.py

      - name: Vérifier le sélecteur d'emojis Win+. (recherche en quatre langues, récents)
        run: python3 -B scripts/test-emoji.py

      - name: Vérifier l'historique du presse-papiers Win+V (épingles, doublons, réglage)
        run: python3 -B scripts/test-clipboard.py

      - name: Vérifier l'ancrage Windows + flèches / Z et la vue des tâches Windows + Tab
        run: python3 -B scripts/test-snap-taskview.py

      - name: Vérifier l'application Horloge (alarmes, minuteurs, concentration)
        run: python3 -B scripts/test-alarms.py

      - name: Vérifier la barre des tâches redessinée (état groupé, recherche, thème clair ou sombre, style flottant)
        run: python3 -B scripts/test-taskbar-redesign.py

      - name: Vérifier les petits outils (pipette, premier plan, renommage en masse)
        run: python3 -B scripts/test-small-tools.py

      - name: Vérifier « Copier le texte » d'une image ou de l'écran (Windows + Maj + T)
        run: python3 -B scripts/test-ocr.py

      - name: Vérifier la dictée vocale et les sous-titres en direct (Windows + H, Windows + Ctrl + L)
        run: xvfb-run -a -s '-screen 0 1366x768x24' /usr/bin/python3 -B scripts/test-speech.py

      - name: Vérifier le thème automatique, le diaporama et les thèmes partageables
        run: python3 -B scripts/test-appearance-auto.py

      - name: Vérifier le fond « Winlux Aurore » (définitions, choix selon l'écran)
        run: python3 -B scripts/test-wallpaper-aurore.py

      - name: Vérifier l'application Jeux (détection, temps de jeu, raccourcis, langues)
        run: python3 -B scripts/test-games.py

      - name: Vérifier l'assistant IA, Claude, ChatGPT et IA locale (désactivés par défaut, envois montrés, téléchargements vérifiés, actions confirmées)
        run: python3 -B scripts/test-assistant.py

      - name: Vérifier « Réinitialiser ce PC » (fichiers gardés, tout supprimer, coupure, clé de secours)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q squashfs-tools busybox-static grub-common xvfb xauth python3-gi gir1.2-gtk-3.0
          python3 -B scripts/test-reset.py
          xvfb-run -a -s '-screen 0 1366x768x24' /usr/bin/python3 -B scripts/test-reset-page.py

      - name: Vérifier les pilotes embarqués dans l'image et le diagnostic winlux-hardware-check
        run: python3 -B scripts/test-hardware-image.py

      - name: Vérifier les pilotes du matériel réel (NVIDIA, microcode, VA-API, page Matériel et pilotes, À propos > Votre PC)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb xauth python3-gi gir1.2-gtk-3.0
          xvfb-run -a -s '-screen 0 1366x768x24' /usr/bin/python3 -B scripts/test-drivers.py
          xvfb-run -a -s '-screen 0 1366x768x24' /usr/bin/python3 -B scripts/test-about-pc.py

      - name: Vérifier le clavier tactile et les réglages avancés de la souris
        run: |
          sudo apt-get install -y -q xvfb xauth xdotool python3-gi python3-gi-cairo gir1.2-gtk-3.0
          xvfb-run -a -s '-screen 0 1366x768x24' /usr/bin/python3 -B scripts/test-input-devices.py
          /usr/bin/python3 -B scripts/test-sound-devices.py
          /usr/bin/python3 -B scripts/test-wifi-image.py
          xvfb-run -a -s '-screen 0 1280x720x24' /usr/bin/python3 -B scripts/test-lock-osk.py
          for screen in 1366x768 1920x1080 2560x1080; do xvfb-run -a -s "-screen 0 ${screen}x24" /usr/bin/python3 -B scripts/test-lock-wake.py; done
          xvfb-run -a -s '-screen 0 1366x768x24' /usr/bin/python3 -B scripts/test-lock-accounts.py
          xvfb-run -a -s '-screen 0 2732x768x24' /usr/bin/python3 -B scripts/test-lock-monitors.py
          xvfb-run -a -s '-screen 0 1366x768x24' /usr/bin/python3 -B scripts/test-lock-signin.py
          xvfb-run -a -s '-screen 0 1366x768x24' /usr/bin/python3 -B scripts/test-signin-page.py
          xvfb-run -a -s '-screen 0 1366x768x24' /usr/bin/python3 -B scripts/test-installer-osk.py
          xvfb-run -a -s '-screen 0 1366x768x24' /usr/bin/python3 -B scripts/test-installer-osk.py --clavier
          xvfb-run -a -s '-screen 0 1366x768x24' /usr/bin/python3 -B scripts/test-installer-licence.py

      - name: Vérifier les grandes images X11 en 1080p
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb xauth libx11-6 libxft2 libcairo2
          xvfb-run -a -s '-screen 0 1920x1080x24' cargo test -p winlux grande_bitmap_1080p -- --ignored
          xvfb-run -a -s '-screen 0 1920x1080x24' cargo test -p winlux contours_anticreneles_x11 -- --ignored

      - name: Valider les codecs audio MP3 et AAC réels
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libmpg123-0 libfaad2 libasound2t64
          ALSA_CONFIG_PATH="$PWD/runtime/tests/audio/alsa-null.conf" cargo test -p winlux audio_codecs -- --ignored
          stage=$(mktemp -d)
          sh scripts/copy-audio-libraries.sh "$stage"

      - name: Valider le moteur vidéo/audio (FFmpeg réel)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          cargo test -p winlux media_bout_en_bout -- --ignored

      - name: Aucune erreur de compilation
        run: cargo check -p winlux --all-targets

      - name: Valider mise à jour et retour arrière
        run: |
          bash scripts/test-updater.sh
          sh scripts/test-update-notes.sh
          python3 -B scripts/test-update-guard.py
          python3 -B scripts/test-apt-metadata.py
          python3 -B scripts/test-update-first-boot.py

      - name: Clé de signature de Flathub inchangée
        # Réseau des runners : l'empreinte publiée par Flathub doit rester celle
        # épinglée dans integration/store-catalogs.json (docs/BOUTIQUES.md).
        run: |
          WINLUX_STORE_CATALOGS_DEFS=integration/store-catalogs.json python3 -B scripts/winlux-store-catalogs.py --check-key flathub

      - name: Navigateurs proposés présents chez leurs éditeurs (informatif, #1716)
        # Index officiels de Brave, Chrome, Edge, Firefox, Opera, Opera GX et
        # Vivaldi ; liste signée de Tor Browser (clé épinglée). Informatif :
        # une panne chez un éditeur ne bloque pas les autres PR.
        continue-on-error: true
        timeout-minutes: 10
        run: sh scripts/check-navigateurs-editeurs.sh

      - name: Sonder les dépôts des éditeurs du Store (informatif)
        continue-on-error: true
        timeout-minutes: 20
        run: python3 -I scripts/check-store-editeurs.py

      - name: Valider le réseau et les commandes des paramètres
        run: |
          sh scripts/test-install-safety.sh
          sh scripts/test-network.sh
          sh scripts/test-control.sh
          python3 -B scripts/test-control-status-cost.py
          python3 -B scripts/test-second-session-taskbar.py
          python3 -B scripts/test-tray-serve.py
          python3 -B scripts/test-panel-tooltips.py
          python3 -B scripts/test-quick-menu-position.py
          python3 -B scripts/test-power.py
          python3 -B scripts/test-power-reboot-guard.py
          python3 -B scripts/test-power-lock-handover.py
          sh scripts/test-fonts.sh
          python3 -B scripts/test-store.py
          sudo apt-get update -q
          sudo sh scripts/test-store-apt-reel.sh
          python3 -B scripts/test-store-catalogs.py
          python3 -B scripts/test-store-declencheurs.py
          python3 -B scripts/test-store-listes-neuves.py
          python3 -B scripts/test-store-editeurs.py
          python3 -B scripts/test-store-licence.py
          sh scripts/test-display.sh
          sh scripts/test-touchpad.sh
          sh scripts/test-speak.sh

      - name: Valider sauvegarde, sessions et bureau à distance
        run: |
          sh scripts/test-backup.sh
          sh scripts/test-sessions.sh
          sh scripts/test-remote.sh
          sh scripts/test-share.sh
          sh scripts/test-transfer.sh

      - name: Partage face aux clients Windows 11 et macOS (vrai Samba)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q samba smbclient wsdd
          sudo systemctl stop smbd nmbd wsdd 2>/dev/null || true
          sudo sh scripts/test-share-clients.sh

  # Wi-Fi sur radios simulées (mac80211_hwsim) avec le wpa_supplicant d'Ubuntu
  # 26.04, celui de l'image : WPA3 en GCMP-256 tranché sans matériel.
  # Box en GCMP-256 seul : joignable si GCMP-256 est demandé, refusée sans
  # (ce que fait NetworkManager) ; winlux-wifi le dit depuis #416.
  wifi-hwsim:
    name: Wi-Fi simulé (WPA3, GCMP-256)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Radios simulées, box hostapd, PC wpa_supplicant
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q hostapd wpasupplicant iw "linux-modules-extra-$(uname -r)" || sudo apt-get install -y -q hostapd wpasupplicant iw
          sudo systemctl stop wpa_supplicant NetworkManager 2>/dev/null || true
          set +e
          sudo WINLUX_EXPECT_GCMP_NM=refuse bash scripts/test-wifi-hwsim-ciphers.sh
          code=$?
          if test "$code" = 77; then echo "::warning::mac80211_hwsim indisponible sur ce runner : Wi-Fi simulé non vérifié"; exit 0; fi
          exit "$code"

  # 3. Compile les .exe Windows puis les exécute sous Winlux.
  runtime-tests:
    name: Tests runtime (PE)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-pe-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-pe-

      - name: Compiler le runtime
        run: cargo build --release -p winlux

      - name: Compiler les exécutables PE de test
        run: bash scripts/build-tests.sh

      - name: Exécuter les tests runtime
        run: bash scripts/test-runtime.sh

      - name: Mémoire au lancement d'un gros .exe (#997)
        run: python3 -B scripts/test-image-memory.py

      - name: DLL système chargée depuis le Bureau sans demande (#1019)
        run: sh scripts/test-loadlibrary-personal-cwd.sh

      - name: Installer des paquets MSIX (#272)
        run: sh scripts/test-msix.sh

      - name: Installer une appli Squirrel (Claude pour Windows)
        run: sh scripts/test-squirrel.sh

      - name: Auto-extractible 7-Zip qui lance son programme (#2390)
        run: sh scripts/test-sfx-programme.sh

      - name: Programmes lancés par les installeurs NSIS (#179)
        run: |
          sudo apt-get install -y -q nsis || { sudo apt-get update -q && sudo apt-get install -y -q nsis; }
          sh scripts/test-setup-run.sh

      - name: Raccourci du Bureau choisi dans l'assistant (#2295)
        run: sh scripts/test-raccourci-bureau.sh

      - name: Dossier système des installateurs NSIS 32 bits (#1800)
        run: sh scripts/test-sysdir-32bits.sh

      - name: Élévation des installateurs (#2180)
        run: sh scripts/test-elevation-installateurs.sh

      - name: Actions personnalisées et services msiexec (#833)
        run: |
          sudo apt-get install -y -q wixl msitools nsis gcc-mingw-w64-x86-64-win32 gcc-mingw-w64-i686-win32 || { sudo apt-get update -q && sudo apt-get install -y -q wixl msitools nsis gcc-mingw-w64-x86-64-win32 gcc-mingw-w64-i686-win32; }
          sh scripts/test-msi-actions.sh

      - name: Actions personnalisées VBScript et JScript (#973)
        run: |
          sudo apt-get install -y -q wixl msitools || { sudo apt-get update -q && sudo apt-get install -y -q wixl msitools; }
          sh scripts/test-msi-scripts.sh

      - name: Construire les paquets MSI de la fiche de banc 833
        run: sh scripts/construire-paquets-833.sh build/paquets-833

      - name: Conserver les paquets MSI de la fiche de banc 833
        uses: actions/upload-artifact@v4
        with:
          name: paquets-833
          path: build/paquets-833
          retention-days: 30

      - name: Assistant d'installation au double-clic (#833)
        run: |
          sudo apt-get install -y -q nsis xvfb python3-gi gir1.2-gtk-3.0 || { sudo apt-get update -q && sudo apt-get install -y -q nsis xvfb python3-gi gir1.2-gtk-3.0; }
          sh scripts/test-setup-wizard.sh

      - name: Contrat de licence des installateurs (#2123 à #2126)
        run: sh scripts/test-licence-installateurs.sh

      - name: Journal de l'assistant écrit au fil de l'eau (#2328)
        run: sh scripts/test-assistant-journal.sh

      - name: Consigne du programme dans les boîtes de fichiers (#2400)
        run: xvfb-run -a -s '-screen 0 1366x768x24' /usr/bin/python3 -B scripts/test-pick-consigne.py

      - name: Exécuter les dix PE en parallèle
        run: bash scripts/test-runtime-parallel.sh

      - name: Tester l'intégration bureau (double-clic)
        run: sh scripts/test-integration.sh

      - name: Installer Winlux sur l'hôte Ubuntu (binfmt, ./hello.exe, association, désinstallation, #27)
        run: |
          sudo apt-get install -y -q binfmt-support xdg-utils || { sudo apt-get update -q && sudo apt-get install -y -q binfmt-support xdg-utils; }
          sudo sh scripts/test-host-install.sh

      - name: Installer MinGW-w64
        run: sudo apt-get update -q && sudo apt-get install -y -q gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 gcc-mingw-w64-i686 g++-mingw-w64-i686 clang lld llvm xvfb xauth libgl1-mesa-dri

      - name: Compiler et exécuter les tests C MinGW
        run: |
          sh scripts/build-mingw-tests.sh
          sh scripts/test-mingw.sh

      - name: Programmes Windows 32 bits (#232)
        run: sh scripts/test-wow32.sh

      - name: Rapport des PE générés
        if: always()
        run: |
          ls -l target/x86_64-pc-windows-msvc/release/*.exe || true

  # 4. Captures d'écran de l'interface, comparées à la dernière version verte
  #    de master : alerte (sans échec) quand un écran change beaucoup.
  captures:
    name: Captures d'écran
    runs-on: ubuntu-latest
    needs: hygiene
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-pe-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-pe-

      - name: Compiler le runtime et les applications maison
        run: |
          cargo build --release -p winlux
          bash scripts/build-tests.sh

      - name: Installer l'écran virtuel
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb xauth openbox wmctrl python3-gi gir1.2-gtk-3.0 \
            gir1.2-gdkpixbuf-2.0 fonts-dejavu-core libx11-6 libxft2 libcairo2 python3-gi-cairo \
            dbus-x11 xfce4-panel xfce4-genmon-plugin xdotool x11-utils imagemagick python3-pil xterm

      - name: Contraste du menu Démarrer, des panneaux et de l'horloge en thème clair et sombre
        run: xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 -B scripts/test-shell-contrast.py

      - name: Texte lisible dans toutes les fenêtres GTK (clair, sombre, accents, contraste élevé, allemand)
        run: xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 -B scripts/test-text-contrast.py

      - name: Texte lisible dans les applications maison du shell PE, dans chaque thème
        run: xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 -B scripts/test-pe-text-contrast.py --seconds 5 --jobs 4

      - name: Store, second clic sur « Installer » pendant une installation expliqué dans le bandeau (#2186)
        run: xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 -B scripts/test-store-bandeau-xvfb.py

      - name: Icônes de la barre des tâches centrées dans leur bouton
        run: xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 -B scripts/test-taskbar-icons.py

      - name: Barre des tâches sans infobulle « (genmon) » ni trait doublé à côté de Démarrer
        run: xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 -B scripts/test-panel-tooltips.py --barre

      - name: Bouton Démarrer immobile au lancement de la barre centrée
        run: xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 -B scripts/test-taskbar-boot-centering.py

      - name: Alignement de la barre appliqué en direct, sans relance manuelle
        run: xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 -B scripts/test-taskbar-live-align.py

      - name: Icônes cachées une par une derrière la flèche de la zone de notification
        run: xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 -B scripts/test-tray-overflow.py

      - name: « Ne répond pas » après la croix, fermeture forcée limitée au compte
        run: xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 -B scripts/test-force-close.py

      - name: Fenêtres agrandies à coins carrés (règle picom, veilleur, migration)
        run: xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 -B scripts/test-maximized-corners.py

      - name: Fenêtre restée sur un écran débranché ramenée sur l'écran restant (#1412)
        run: WINLUX=target/release/winlux sh scripts/test-display-bring-back.sh

      - name: Fenêtres PE gérées par openbox (bureau, machine, PID, classe)
        run: xvfb-run -a -s '-screen 0 1366x768x24' /usr/bin/python3 -B scripts/test-pe-window-props.py

      - name: Fenêtre Jeux (cartes, tri, recherche)
        run: |
          mkdir -p build/captures
          xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 -B scripts/test-games.py --gtk build/captures/jeux-bibliotheque.png

      - name: Version précédente conservée (même avis partout) et session hors des applications
        run: xvfb-run -a /usr/bin/python3 -B scripts/test-update-previous-version.py

      - name: Page Mise à jour OS (carte d'état, pause, heures d'activité, historique, notes, notification, 4 langues)
        run: /usr/bin/python3 -B scripts/test-update-page.py

      - name: Paramètres Réseau, Comptes et Personnalisation refaits (carte de connexion, compte ouvert, aperçu du bureau)
        run: xvfb-run -a /usr/bin/python3 -B scripts/test-settings-redesign.py

      - name: Bulle de notification en bas à droite au-dessus de la barre (icône, nom, clic, croix)
        run: xvfb-run -a -s '-screen 0 1366x768x24' dbus-run-session --config-file=scripts/test-session-bus.conf -- /usr/bin/python3 -B scripts/test-notification-toast.py

      - name: Touches de volume du clavier sous openbox réel (pas de 2 %, sourdine, micro, indicateur)
        run: xvfb-run -a -s '-screen 0 1366x768x24' /usr/bin/python3 -B scripts/test-volume-keys.py

      - name: Réglages rapides Win+A (tuiles selon le matériel, luminosité, mode avion, VPN, point d'accès, langues)
        run: |
          xvfb-run -a -s '-screen 0 1366x768x24' /usr/bin/python3 -B scripts/test-quick-settings.py
          xvfb-run -a -s '-screen 0 1366x768x24' /usr/bin/python3 -B scripts/test-brightness.py
          xvfb-run -a -s '-screen 0 1366x768x24' /usr/bin/python3 -B scripts/test-display-page-follow.py
          /usr/bin/python3 -B scripts/test-brightness.py
          xvfb-run -a -s '-screen 0 1366x768x24' /usr/bin/python3 -B scripts/test-certificates.py
          /usr/bin/python3 -B scripts/test-boot-journaux.py
          /usr/bin/python3 -B scripts/test-ecran-veille-retour.py
          xvfb-run -a -s '-screen 0 1366x768x24' /usr/bin/python3 -B scripts/test-wifi.py
          xvfb-run -a -s '-screen 0 1024x600x24' /usr/bin/python3 -B scripts/test-wifi.py
          # VPN et point d'accès sans fil mobile (#660) : services, relais, pages GTK.
          /usr/bin/python3 -B scripts/test-vpn-hotspot.py
          xvfb-run -a -s '-screen 0 1366x768x24' /usr/bin/python3 -B scripts/test-vpn-hotspot.py
          xvfb-run -a -s '-screen 0 1024x600x24' /usr/bin/python3 -B scripts/test-vpn-hotspot.py
          xvfb-run -a -s '-screen 0 1366x768x24' dbus-run-session --config-file=scripts/test-session-bus.conf -- /usr/bin/python3 -B scripts/test-shell-popups.py quick

      - name: Navigation au clavier (menu Démarrer, réglages rapides)
        run: |
          for kind in start quick; do
            xvfb-run -a -s '-screen 0 1920x1080x24' dbus-run-session --config-file=scripts/test-session-bus.conf -- /usr/bin/python3 -B scripts/test-keyboard-nav.py "$kind"
          done

      - name: Menu Démarrer sur tablette (clavier tactile intégré, appuis xdotool)
        run: xvfb-run -a -s '-screen 0 1366x768x24' dbus-run-session --config-file=scripts/test-session-bus.conf -- /usr/bin/python3 -B scripts/test-start-menu-osk.py

      - name: Menu Démarrer rouvert dans son état initial (vue Épinglé, recherche vide, liste en haut)
        run: xvfb-run -a -s '-screen 0 1366x768x24' dbus-run-session --config-file=scripts/test-session-bus.conf -- /usr/bin/python3 -B scripts/test-start-menu-reset.py

      - name: Menu Démarrer préchargé à l'ouverture de session et réveillé par D-Bus
        run: xvfb-run -a -s '-screen 0 1366x768x24' dbus-run-session --config-file=scripts/test-session-bus.conf -- /usr/bin/python3 -B scripts/test-start-menu-preload.py

      - name: Menu Démarrer, déplacer une application épinglée (clic droit et glisser-déposer) (#925)
        run: xvfb-run -a -s '-screen 0 1366x768x24' dbus-run-session --config-file=scripts/test-session-bus.conf -- /usr/bin/python3 -B scripts/test-start-pin-move.py

      - name: Navigateurs, éditeur, version et source montrés avant l'installation (#923)
        run: xvfb-run -a -s '-screen 0 1366x768x24' dbus-run-session --config-file=scripts/test-session-bus.conf -- /usr/bin/python3 -B scripts/test-browser-confirm.py

      - name: Menu Démarrer à deux volets (« Pour vous » local, Masquer recentre, catégories, liste A–Z) (#685)
        run: |
          /usr/bin/python3 -B scripts/test-start-for-you.py
          for size in 1366x768 1920x1080 1024x600; do
            xvfb-run -a -s "-screen 0 ${size}x24" dbus-run-session --config-file=scripts/test-session-bus.conf -- /usr/bin/python3 -B scripts/test-start-for-you.py
          done

      - name: Paramètres > Applications installées (Linux et Windows, tri, Désinstaller) et menu Démarrer sans « Gestionnaire de fichiers » (#721, #722)
        run: |
          /usr/bin/python3 -B scripts/test-installed-apps.py
          for size in 1366x768 1920x1080; do
            xvfb-run -a -s "-screen 0 ${size}x24" /usr/bin/python3 -B scripts/test-installed-apps.py
          done

      - name: Recherche du menu Démarrer (Paramètres en 4 langues, groupes, fichiers, bouton Rechercher)
        run: xvfb-run -a -s '-screen 0 1366x768x24' dbus-run-session --config-file=scripts/test-session-bus.conf -- /usr/bin/python3 -B scripts/test-start-search.py

      - name: Démarrer, homonymes départagés et distingués (#1489)
        run: xvfb-run -a -s '-screen 0 1366x768x24' /usr/bin/python3 -B scripts/test-start-homonyms.py

      - name: Trousseau de secrets créé et ouvert à la connexion, sans fenêtre (#1488)
        run: |
          sudo apt-get install -y -q gnome-keyring libsecret-tools dbus libglib2.0-bin || { sudo apt-get update -q && sudo apt-get install -y -q gnome-keyring libsecret-tools dbus libglib2.0-bin; }
          /usr/bin/python3 -B scripts/test-keyring.py

      - name: Bulles des programmes Windows et notification de « Coller » par D-Bus, sans notify-send (#630)
        run: dbus-run-session --config-file=scripts/test-session-bus.conf -- /usr/bin/python3 -B scripts/test-notify-dbus.py

      - name: Volet de widgets Win+W (ouverture au bord gauche, ordre, minuteur, Échap)
        run: xvfb-run -a -s '-screen 0 1366x768x24' /usr/bin/python3 -B scripts/test-widgets.py

      - name: Ancrage à la souris sous openbox (bords, coins, barre des dispositions, survol d'Agrandir)
        run: xvfb-run -a -s '-screen 0 1366x768x24' /usr/bin/python3 -B scripts/test-snap-mouse.py

      - name: Touche Windows seule pour Démarrer sous openbox réel (Win+Gauche, Win+Z intacts)
        run: xvfb-run -a -s '-screen 0 1366x768x24' /usr/bin/python3 -B scripts/test-super-key.py

      - name: Assistant et groupes d'ancrage sous openbox (place libre, quarts, cases prises, clavier, survol de la barre)
        run: xvfb-run -a -s '-screen 0 1366x768x24' /usr/bin/python3 -B scripts/test-snap-assist.py

      - name: Raccourcis Windows (Win+I/S/R/X/P), boîte Exécuter et menu d'accès rapide
        run: xvfb-run -a -s '-screen 0 1366x768x24' /usr/bin/python3 -B scripts/test-run-dialog.py

      - name: Windows + X au-dessus du bouton Démarrer sous openbox réel
        run: /usr/bin/python3 -B scripts/test-quick-menu-position.py

      - name: Bureau en 1080p, 1440p et 4K (menu Démarrer, réglages rapides, Paramètres)
        run: |
          mkdir -p build/captures
          for size in 1920x1080 2560x1440 3840x2160; do
            xvfb-run -a -s "-screen 0 ${size}x24" /usr/bin/python3 -B scripts/test-resolutions.py build/captures
          done

      - name: Capturer les écrans
        run: xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 -B scripts/capture-ui.py build/captures

      - name: Récupérer les captures de la dernière version verte de master
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          mkdir -p build/captures-ref
          for run in $(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch master --event push \
                         --status success --limit 10 --json databaseId -q '.[].databaseId'); do
            test "$run" = "$GITHUB_RUN_ID" && continue
            if gh run download "$run" -R "$GITHUB_REPOSITORY" -n captures-ui -D build/captures-ref 2>/dev/null; then
              echo "Référence : exécution $run"
              break
            fi
          done

      - name: Comparer à la version précédente
        if: always()
        run: |
          /usr/bin/python3 -B scripts/compare-captures.py build/captures-ref build/captures build/captures-diff
          cat build/captures-diff/rapport.md >> "$GITHUB_STEP_SUMMARY"

      # Une page index.html dans chaque artefact : on décompresse, on l'ouvre,
      # toutes les captures du commit y sont, avec le pourcentage changé (#1779).
      # sh scripts/telecharger-captures.sh rapatrie plusieurs exécutions d'un coup.
      - name: Page index.html des captures
        if: always()
        run: |
          mkdir -p build/captures build/captures-diff
          /usr/bin/python3 -I scripts/index-captures.py build/captures --rapport build/captures-diff/rapport.json \
            --titre "Captures d'écran Winlux ${GITHUB_SHA::7}"
          /usr/bin/python3 -I scripts/index-captures.py build/captures-diff --rapport build/captures-diff/rapport.json \
            --titre "Pixels changés ${GITHUB_SHA::7}"

      # 90 jours, le maximum d'un dépôt public, où le stockage est gratuit (#1779).
      - name: Conserver les captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-ui
          path: build/captures
          retention-days: 90

      - name: Conserver les différences
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-ui-diff
          path: build/captures-diff
          retention-days: 90
