name: Diagnostic DNS (minimal)
on:
  push:
    branches: [claude/project-thread-rq95s0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dns:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - name: DNS brut
        run: |
          set -x
          head -3 /etc/os-release; echo "ImageVersion=$ImageVersion"
          ls -l /etc/resolv.conf; cat /etc/resolv.conf
          resolvectl status 2>&1 | head -40 || true
          getent hosts github.com || echo "ECHEC github.com"
          getent hosts archive.ubuntu.com || echo "ECHEC archive.ubuntu.com"
          getent hosts azure.archive.ubuntu.com || echo "ECHEC azure.archive.ubuntu.com"
          dig +time=3 +tries=1 archive.ubuntu.com @168.63.129.16 || true
          dig +time=3 +tries=1 archive.ubuntu.com @1.1.1.1 || true
          curl -sSI --max-time 20 https://archive.ubuntu.com/ubuntu/ | head -3 || echo "ECHEC curl"
          curl -sSI --max-time 20 http://azure.archive.ubuntu.com/ubuntu/ | head -3 || echo "ECHEC curl azure"
          timeout 120 sudo apt-get update -q 2>&1 | tail -8 || true
