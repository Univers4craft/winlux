[package]
name = "winlux"
version = "0.1.0"
edition = "2021"
description = "Runtime Winlux : chargeur PE et API Win32 écrits de zéro (clean-room), sans Wine"
license = "GPL-3.0-or-later"

[[bin]]
name = "winlux"
path = "src/main.rs"

# Serveur de bureau à distance (RFB/VNC maison, chiffrement RSA-AES).
[[bin]]
name = "winlux-remote"
path = "src/remote/main.rs"

[dependencies]
libc = "0.2"
png = "0.18.1"
x11rb = { version = "0.14.0", features = ["screensaver", "xtest", "xfixes"] }
