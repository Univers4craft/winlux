# Compositeur de la session Winlux : plus de traînées quand on déplace une
# fenêtre (chaque appli n'a plus à repeindre ce qu'elle découvre), ombres et
# coins arrondis façon Windows 11. Rendu xrender : fonctionne aussi sans
# accélération 3D (VM, pilote générique).
backend = "xrender";
vsync = true;
# Pas de bascule composé/direct : certaines fenêtres ne se repeignaient
# pas entièrement à cette transition.
unredir-if-possible = false;

shadow = true;
shadow-radius = 18;
shadow-opacity = 0.35;
shadow-offset-x = -16;
shadow-offset-y = -12;

corner-radius = 8;

fading = true;
fade-delta = 6;
fade-in-step = 0.08;
fade-out-step = 0.1;

rules = (
  { match = "window_type = 'dock' || window_type = 'desktop'"; shadow = false; corner-radius = 0; },
  { match = "fullscreen"; corner-radius = 0; shadow = false; },
  # Fenêtre agrandie : coins carrés comme Windows 11, sinon le fond d'écran
  # apparaît aux quatre coins. En pratique picom 12.5 ne retrouvait pas
  # _NET_WM_STATE de l'application, même avec « @ » : winlux-maximized-watch
  # le recopie sur le cadre d'openbox. Ne pas le remplacer par une règle « @ »
  # sans l'avoir vue marcher (capture prise après picom).
  { match = "_WINLUX_MAXIMIZED = 1"; corner-radius = 0; shadow = false; },
  { match = "window_type = 'dnd' || window_type = 'tooltip'"; shadow = false; },
  # Fenêtre GTK à décorations côté client : elle dessine sa propre ombre.
  # _GTK_FRAME_EXTENTS est recopiée sur le cadre en _WINLUX_CSD par
  # winlux-maximized-watch ; la règle avec « @ » ne correspondait pas (#583).
  { match = "_WINLUX_CSD = 1"; shadow = false; },
);
