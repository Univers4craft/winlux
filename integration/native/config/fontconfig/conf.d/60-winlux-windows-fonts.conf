<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Winlux : polices partagées entre Linux et les applications Windows.
  Copié dans ~/.config/fontconfig/conf.d/ à l'ouverture de session.

  - Les polices qu'une application Windows installe dans C:\Windows\Fonts
    (ou dans le dossier par utilisateur de Windows 10+) deviennent visibles
    de toutes les applications Linux.
  - Les noms de polices Windows absentes sont remplacés par des polices
    libres aux métriques compatibles, pour garder la mise en page.
-->
<fontconfig>
  <dir>~/Windows/Fonts</dir>
  <dir>~/windows/Fonts</dir>
  <dir>~/WINDOWS/Fonts</dir>
  <dir>~/AppData/Local/Microsoft/Windows/Fonts</dir>

  <alias binding="same">
    <family>Arial</family>
    <prefer><family>Liberation Sans</family><family>DejaVu Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>Helvetica</family>
    <prefer><family>Liberation Sans</family><family>DejaVu Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>Times New Roman</family>
    <prefer><family>Liberation Serif</family><family>DejaVu Serif</family></prefer>
  </alias>
  <alias binding="same">
    <family>Courier New</family>
    <prefer><family>Liberation Mono</family><family>DejaVu Sans Mono</family></prefer>
  </alias>
  <alias>
    <family>Segoe UI</family>
    <prefer><family>Liberation Sans</family><family>DejaVu Sans</family></prefer>
  </alias>
  <alias>
    <family>Segoe UI Variable</family>
    <prefer><family>Liberation Sans</family><family>DejaVu Sans</family></prefer>
  </alias>
  <alias>
    <family>Tahoma</family>
    <prefer><family>DejaVu Sans</family><family>Liberation Sans</family></prefer>
  </alias>
  <alias>
    <family>Verdana</family>
    <prefer><family>DejaVu Sans</family><family>Liberation Sans</family></prefer>
  </alias>
  <alias>
    <family>MS Shell Dlg</family>
    <prefer><family>Liberation Sans</family><family>DejaVu Sans</family></prefer>
  </alias>
  <alias>
    <family>MS Shell Dlg 2</family>
    <prefer><family>Liberation Sans</family><family>DejaVu Sans</family></prefer>
  </alias>
  <alias>
    <family>MS Sans Serif</family>
    <prefer><family>Liberation Sans</family><family>DejaVu Sans</family></prefer>
  </alias>
  <alias>
    <family>Microsoft Sans Serif</family>
    <prefer><family>Liberation Sans</family><family>DejaVu Sans</family></prefer>
  </alias>
  <alias>
    <family>Calibri</family>
    <prefer><family>Carlito</family><family>Liberation Sans</family><family>DejaVu Sans</family></prefer>
  </alias>
  <alias>
    <family>Cambria</family>
    <prefer><family>Caladea</family><family>Liberation Serif</family><family>DejaVu Serif</family></prefer>
  </alias>
  <alias>
    <family>Georgia</family>
    <prefer><family>DejaVu Serif</family><family>Liberation Serif</family></prefer>
  </alias>
  <alias>
    <family>Consolas</family>
    <prefer><family>DejaVu Sans Mono</family><family>Liberation Mono</family></prefer>
  </alias>
  <alias>
    <family>Cascadia Mono</family>
    <prefer><family>DejaVu Sans Mono</family><family>Liberation Mono</family></prefer>
  </alias>
  <alias>
    <family>Lucida Console</family>
    <prefer><family>DejaVu Sans Mono</family><family>Liberation Mono</family></prefer>
  </alias>
</fontconfig>
