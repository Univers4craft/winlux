# Prefer wired default routes. Ubuntu's NetworkManager may still integrate
# with Netplan independently of the selected settings plugin.
[connection-winlux-wired]
match-device=type:ethernet
ipv4.route-metric=100
ipv6.route-metric=100

[connection-winlux-wifi]
match-device=type:wifi
ipv4.route-metric=600
ipv6.route-metric=600

# Sans systemd ni systemd-resolved, NetworkManager écrit lui-même
# /etc/resolv.conf avec les DNS reçus par DHCP (sinon la résolution de noms
# reste sur le serveur de QEMU figé dans l'image et échoue dans les autres VM).
[main]
dns=default
rc-manager=file

# Ubuntu laisse l'Ethernet à Netplan/systemd-networkd, absents ici : toutes
# les cartes sont gérées par NetworkManager.
[keyfile]
unmanaged-devices=none
