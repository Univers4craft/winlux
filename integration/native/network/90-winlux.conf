# Prefer wired default routes. Ubuntu's NetworkManager may still integrate
# with Netplan independently of the selected settings plugin.

# Ubuntu's 10-globally-managed-devices.conf leaves Ethernet to Netplan, which
# Winlux does not run: without this override the wired card stays unmanaged
# and down, so updates fail with "Could not resolve host".
[keyfile]
unmanaged-devices=none

[connection-winlux-wired]
match-device=type:ethernet
ipv4.route-metric=100
ipv6.route-metric=100

[connection-winlux-wifi]
match-device=type:wifi
ipv4.route-metric=600
ipv6.route-metric=600
